name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Check which apps exist in the repo
        run: |
          test -f backend/pom.xml && echo "backend=true" >> $GITHUB_OUTPUT || echo "backend=false" >> $GITHUB_OUTPUT
          test -f frontend/package.json && echo "frontend=true" >> $GITHUB_OUTPUT || echo "frontend=false" >> $GITHUB_OUTPUT

  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: docker compose config -q

  backend-build:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test backend
        run: mvn -B verify
        working-directory: backend

  frontend-build:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  frontend-lint:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

  docker-build:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the backend image the way Render does
        run: docker build -f backend/Dockerfile backend/

  migration-check:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: travel
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use production's real data as the starting point
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An empty database cannot catch the migrations that actually hurt:
          # a NOT NULL added over existing rows, a UNIQUE over duplicates, or a
          # changeset edited after it already ran. The nightly Backup job keeps
          # a real dump of production, so start from that instead.
          run_id=$(gh run list --workflow=backup.yml --status success \
                     --limit 1 --json databaseId --jq '.[0].databaseId')

          if [ -z "$run_id" ]; then
            echo "No successful backup run to borrow a baseline from."
            echo "restored=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh run download "$run_id" --dir /tmp/baseline; then
            echo "The backup artifact is gone or expired (they live 90 days)."
            echo "restored=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # travel-*.sql.gz is production. travel_staging-*.sql.gz is not what
          # we want here, and the dash in the pattern keeps it out.
          dump=$(find /tmp/baseline -name 'travel-*.sql.gz' | head -1)
          if [ -z "$dump" ]; then
            echo "That artifact carries no production dump."
            echo "restored=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Restoring $(basename "$dump")"
          gunzip -c "$dump" | docker run --rm -i --network host -e MYSQL_PWD=test \
            mysql:8.4 mysql -h 127.0.0.1 -P 3306 -u root

          # The dump carries the lock row with it, and the runner that held the
          # lock is long gone. Liquibase would wait for it forever.
          docker run --rm --network host -e MYSQL_PWD=test mysql:8.4 \
            mysql -h 127.0.0.1 -P 3306 -u root \
            -e "UPDATE travel.DATABASECHANGELOGLOCK SET LOCKED = 0, LOCKGRANTED = NULL, LOCKEDBY = NULL"

          applied=$(docker run --rm --network host -e MYSQL_PWD=test mysql:8.4 \
            mysql -h 127.0.0.1 -P 3306 -u root -N -B \
            -e "SELECT COUNT(*) FROM travel.DATABASECHANGELOG")
          echo "Baseline is production as of that backup: $applied changesets, real rows."
          echo "restored=yes" >> "$GITHUB_OUTPUT"

      - name: Fall back to replaying main when there was no backup
        if: steps.baseline.outputs.restored != 'yes'
        run: |
          # Weaker than the real thing, but better than skipping the check.
          git fetch --no-tags origin main
          mkdir -p /tmp/base
          git archive origin/main backend/src/main/resources | tar -x -C /tmp/base
          docker run --rm --network host -v /tmp/base/backend/src/main/resources:/lb \
            --entrypoint sh liquibase/liquibase:4.29 -c \
            "lpm add mysql --global >/dev/null && liquibase --search-path=/lb \
             --changeLogFile=db/changelog/db.changelog-master.yaml \
             --url='jdbc:mysql://127.0.0.1:3306/travel' --username=root --password=test update"

      - name: Apply this branch's migrations on top
        run: |
          docker run --rm --network host -v "$PWD/backend/src/main/resources:/lb" \
            --entrypoint sh liquibase/liquibase:4.29 -c \
            "lpm add mysql --global >/dev/null && liquibase --search-path=/lb \
             --changeLogFile=db/changelog/db.changelog-master.yaml \
             --url='jdbc:mysql://127.0.0.1:3306/travel' --username=root --password=test update"
