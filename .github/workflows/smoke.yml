name: Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BACKEND_URL: https://travel-planner-backend-4tb0.onrender.com
  FRONTEND_URL: https://team-project-243.vercel.app
  RENDER_SERVICE_ID: srv-d9htdbbeo5us73dl8o3g

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the Render deploy for this commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        if: env.RENDER_API_KEY != ''
        run: |
          deadline=$(( $(date +%s) + 900 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body=$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=20") || true
            status=$(echo "$body" | jq -r --arg sha "$GITHUB_SHA" \
              '[.[].deploy | select(.commit.id == $sha)] | first | .status // empty')

            case "$status" in
              live)
                echo "Render deploy for $GITHUB_SHA is live."
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated)
                echo "Render deploy for $GITHUB_SHA ended as '$status'."
                echo "Production is still serving the previous version."
                exit 1
                ;;
              "")
                echo "No Render deploy for this commit yet."
                ;;
              *)
                echo "Render deploy is '$status', waiting."
                ;;
            esac
            sleep 30
          done
          echo "No Render deploy for $GITHUB_SHA within 15 minutes."
          echo "Render only deploys when files under backend/ change, so this is expected"
          echo "for commits that touch nothing there. Continuing to the endpoint checks."

      - name: Backend is healthy
        run: |
          code=$(curl -sS -o health.json -w '%{http_code}' \
            --max-time 180 --retry 5 --retry-delay 30 --retry-all-errors \
            "$BACKEND_URL/actuator/health")
          cat health.json
          echo
          test "$code" = "200"
          grep -q '"status":"UP"' health.json

      - name: Backend serves the API
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$BACKEND_URL/api/v1/trips")
          echo "GET /api/v1/trips -> $code"
          if [ "$code" -ge 500 ]; then
            echo "The application is up but the API is failing."
            exit 1
          fi

      - name: Frontend serves the app
        run: |
          code=$(curl -sS -o index.html -w '%{http_code}' --max-time 60 "$FRONTEND_URL/")
          test "$code" = "200"
          grep -q 'id="root"' index.html

      - name: Frontend routes deep links to the SPA
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$FRONTEND_URL/trips/smoke-test")
          echo "GET /trips/smoke-test -> $code"
          test "$code" = "200"

      - name: Frontend serves hashed assets as themselves
        run: |
          asset=$(grep -o '/assets/[^"]*\.js' index.html | head -1)
          echo "asset: $asset"
          type=$(curl -sS -o /dev/null -w '%{content_type}' --max-time 60 "$FRONTEND_URL$asset")
          echo "content-type: $type"
          case "$type" in
            *javascript*) ;;
            *) echo "The SPA rewrite is swallowing static assets."; exit 1 ;;
          esac
