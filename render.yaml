services:
  - type: web
    name: travel-planner-backend
    runtime: docker
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://travel-mysql-mr-b549.d.aivencloud.com:18032/travel?sslMode=REQUIRED
      - key: SPRING_DATASOURCE_USERNAME
        value: avnadmin
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: NOMINATIM_URL
        value: https://nominatim.openstreetmap.org
      - key: NOMINATIM_USER_AGENT
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://team-project-243.vercel.app
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: '3600000'
      - key: SUPABASE_STORAGE_BUCKET
        value: user-images
      - key: SUPABASE_S3_ENDPOINT
        value: https://gvuchidiqyxjrpzjsnjb.storage.supabase.co/storage/v1/s3
      - key: SUPABASE_S3_REGION
        value: eu-west-1
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: travel-planner-backend-staging
    runtime: docker
    branch: dev
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://travel-mysql-mr-b549.d.aivencloud.com:18032/travel_staging?sslMode=REQUIRED
      - key: SPRING_DATASOURCE_USERNAME
        value: avnadmin
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: NOMINATIM_URL
        value: https://nominatim.openstreetmap.org
      - key: NOMINATIM_USER_AGENT
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: '3600000'
      - key: SUPABASE_STORAGE_BUCKET
        value: user-images-staging
      - key: SUPABASE_S3_ENDPOINT
        value: https://gvuchidiqyxjrpzjsnjb.storage.supabase.co/storage/v1/s3
      - key: SUPABASE_S3_REGION
        value: eu-west-1
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
